<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lantell — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;1,200;1,300&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cream: #FAF6F1;
      --cream-dark: #F0EAE0;
      --maroon: #2D0A0A;
      --maroon-mid: #5C1A1A;
      --maroon-light: #8B3A3A;
      --text-primary: #1C0A0A;
      --text-muted: #5A3F3F;
      --border: rgba(45, 10, 10, 0.12);
      --gold: #C4973A;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Spectral', Georgia, serif;
      font-weight: 300;
      color: var(--text-primary);
      background-color: var(--cream);
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(139, 58, 58, 0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(196, 151, 58, 0.03) 0%, transparent 50%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      animation: fadeUp 0.6s ease forwards;
    }

    .wordmark {
      animation: fadeUp 0.6s ease 0.1s forwards;
      opacity: 0;
    }

    .tagline {
      animation: fadeUp 0.6s ease 0.2s forwards;
      opacity: 0;
    }

    .role-section {
      animation: fadeUp 0.6s ease 0.3s forwards;
      opacity: 0;
    }

    .form-section {
      animation: fadeUp 0.6s ease 0.4s forwards;
      opacity: 0;
    }

    .footnote {
      animation: fadeUp 0.6s ease 0.5s forwards;
      opacity: 0;
    }

    /* Eyebrow */
    .eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 300;
      margin-bottom: 48px;
    }

    /* Wordmark */
    .wordmark {
      font-size: clamp(3.5rem, 8vw, 6rem);
      font-weight: 200;
      color: var(--maroon);
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 16px;
      font-style: italic;
    }

    /* Tagline */
    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 300;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 64px;
      max-width: 480px;
    }

    /* Role Section */
    .role-section {
      width: 100%;
    }

    .role-label {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      text-transform: uppercase;
      font-variant: small-caps;
      margin-bottom: 12px;
      font-weight: 300;
    }

    .role-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .role-pill {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 100px;
      font-family: 'Spectral', Georgia, serif;
      font-size: 0.85rem;
      font-weight: 300;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .role-pill:hover {
      border-color: var(--maroon-light);
      color: var(--maroon-light);
    }

    .role-pill.selected {
      background: var(--maroon);
      border-color: var(--maroon);
      color: var(--cream);
    }

    /* Form Section */
    .form-section {
      width: 100%;
      margin-top: 24px;
    }

    .input-row {
      display: flex;
      width: 100%;
    }

    #email-input {
      flex: 1;
      padding: 12px 18px;
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 6px 0 0 6px;
      background: white;
      font-family: 'Spectral', Georgia, serif;
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      -webkit-font-smoothing: antialiased;
    }

    #email-input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }

    #email-input:focus {
      border-color: var(--maroon-light);
      box-shadow: 0 0 0 3px rgba(45, 10, 10, 0.08);
    }

    #submit-btn {
      padding: 12px 24px;
      background: var(--maroon);
      color: var(--cream);
      border: none;
      border-radius: 0 6px 6px 0;
      font-family: 'Spectral', Georgia, serif;
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
      -webkit-font-smoothing: antialiased;
    }

    #submit-btn:hover:not(:disabled) {
      background: var(--maroon-mid);
    }

    #submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Error */
    #error-msg {
      display: none;
      font-size: 0.78rem;
      color: #9B2C2C;
      margin-top: 8px;
    }

    /* Success */
    #success-section {
      display: none;
      margin-top: 24px;
    }

    .success-primary {
      font-size: 1.1rem;
      font-weight: 300;
      color: var(--maroon);
      font-style: italic;
    }

    .success-secondary {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Footnote */
    .footnote {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      margin-top: 80px;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .container {
        padding: 48px 20px;
      }

      .role-pills {
        justify-content: center;
      }

      .input-row {
        flex-direction: column;
        gap: 0;
      }

      #email-input {
        border-right: 1px solid var(--border);
        border-bottom: none;
        border-radius: 6px 6px 0 0;
        width: 100%;
      }

      #email-input:focus {
        border-color: var(--maroon-light);
        box-shadow: 0 0 0 3px rgba(45, 10, 10, 0.08);
      }

      #submit-btn {
        border-radius: 0 0 6px 6px;
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="eyebrow">Private Beta</p>

    <h1 class="wordmark">Lantell</h1>

    <p class="tagline">The verification layer for high-stakes property work.</p>

    <div id="form-section-wrapper">
      <div class="role-section">
        <p class="role-label">I am a</p>
        <div class="role-pills">
          <button class="role-pill" data-role="property_manager">Property Manager</button>
          <button class="role-pill" data-role="vendor">Vendor</button>
          <button class="role-pill" data-role="investor">Investor</button>
        </div>
      </div>

      <div class="form-section" id="form-section">
        <form id="waitlist-form">
          <div class="input-row">
            <input
              type="email"
              id="email-input"
              placeholder="your@email.com"
              autocomplete="email"
              required
            />
            <button type="submit" id="submit-btn">Join Waitlist</button>
          </div>
          <p id="error-msg">Something went wrong — please try again.</p>
        </form>
      </div>

      <div id="success-section">
        <p class="success-primary">You're on the list.</p>
        <p class="success-secondary">We'll be in touch.</p>
      </div>
    </div>

    <p class="footnote">Built for property managers and vendors who take their work seriously.</p>
  </div>

  <script>
    const { createClient } = supabase;
    const client = createClient(
      'https://guuctgeqzwbfgwmrgfez.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dWN0Z2VxendiZmd3bXJnZmV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0Mjk5MjYsImV4cCI6MjA4NjAwNTkyNn0.2U-51OudzCUBWgG8CUBesHU4v70v79oykGwwuodYcDo'
    );

    let selectedRole = null;

    // Role pill selection
    document.querySelectorAll('.role-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.role-pill').forEach(p => p.classList.remove('selected'));
        pill.classList.add('selected');
        selectedRole = pill.dataset.role;
      });
    });

    // Form submission
    document.getElementById('waitlist-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email-input').value.trim();
      if (!email) return;

      const btn = document.getElementById('submit-btn');
      btn.textContent = 'Joining...';
      btn.disabled = true;

      document.getElementById('error-msg').style.display = 'none';

      const { error } = await client.from('waitlist').insert({
        email,
        role: selectedRole,
      });

      if (error) {
        document.getElementById('error-msg').style.display = 'block';
        btn.textContent = 'Join Waitlist';
        btn.disabled = false;
      } else {
        document.getElementById('form-section').style.display = 'none';
        document.querySelector('.role-section').style.display = 'none';
        document.getElementById('success-section').style.display = 'block';
      }
    });
  </script>
</body>
</html>
